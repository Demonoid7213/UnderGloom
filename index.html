<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnderGloom</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: Arial, sans-serif;
            color: #ccc;
        }
        #gameContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #gameCanvas {
            border: 3px solid #1a3a3a;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.2);
            display: block;
            background: #0a1a1f;
        }
        #info {
            text-align: center;
            color: #6ec8ff;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(110, 200, 255, 0.5);
        }
        #debug {
            color: #6ec8ff;
            font-size: 12px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="info">
            <h1>UnderGloom</h1>
            <p>Use WASD or Arrow Keys to move</p>
        </div>
        <canvas id="gameCanvas" width="1024" height="576"></canvas>
        <div id="debug">Position: (0, 0) | Moving: No</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const debugEl = document.getElementById('debug');

        // ==================== CONSTANTS ====================
        const TILE_SIZE = 8;
        const CHUNK_WIDTH = 16;
        const CHUNK_HEIGHT = 16;
        const CHUNK_PIXEL_WIDTH = CHUNK_WIDTH * TILE_SIZE;
        const CHUNK_PIXEL_HEIGHT = CHUNK_HEIGHT * TILE_SIZE;
        const WORLD_WIDTH = 10000;
        const WORLD_HEIGHT = 1000;
        const PLAYER_SPEED = 120;

        // ==================== TILE COLORS ====================
        const TILE_COLORS = {
            'mire-clay': '#4a3a2a',
            'blink-moss': '#5a8a3a',
            'mushroom': '#6a4a8a',
            'lumen-pustule': '#aaff44',
            'hardened-clay': '#2a3a4a',
            'coal-ore': '#1a1a1a',
            'iron-ore': '#3a3a3a',
            'empty': '#0a1a1f'
        };

        // ==================== TERRAIN GENERATOR ====================
        class TerrainGenerator {
            constructor() {
                this.seed = 12345;
            }

            seededRandom(x, y, seed = this.seed) {
                const n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
                return n - Math.floor(n);
            }

            generateTile(worldX, worldY) {
                const rand = this.seededRandom(worldX, worldY);
                const oreNoise = this.seededRandom(worldX * 1.5, worldY * 1.5);

                // Surface layer
                if (worldY < 2) {
                    if (rand < 0.3) return 'mire-clay';
                    if (rand < 0.5) return 'blink-moss';
                    if (rand < 0.65) return 'mushroom';
                    if (rand < 0.8) return 'lumen-pustule';
                    return 'empty';
                }

                // Upper ground
                if (worldY < 6) {
                    if (rand < 0.7) return 'mire-clay';
                    if (rand < 0.85 && oreNoise > 0.7) return 'coal-ore';
                    if (rand < 0.95 && oreNoise > 0.8) return 'iron-ore';
                    return 'empty';
                }

                // Deep underground
                if (rand < 0.5) return 'hardened-clay';
                if (oreNoise > 0.75) {
                    if (oreNoise > 0.9) return 'iron-ore';
                    if (oreNoise > 0.85) return 'coal-ore';
                    return 'coal-ore';
                }

                return 'empty';
            }
        }

        // ==================== PLAYER ====================
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.width = 6;
                this.height = 6;
            }

            update(keys) {
                // Apply input
                if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                    this.vx = -PLAYER_SPEED;
                } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                    this.vx = PLAYER_SPEED;
                } else {
                    this.vx *= 0.8;
                }

                if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                    this.vy = -PLAYER_SPEED * 0.7;
                } else if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                    this.vy = PLAYER_SPEED * 0.7;
                } else {
                    this.vy *= 0.8;
                }

                // Update position
                this.x += this.vx / 60;
                this.y += this.vy / 60;

                // Clamp to world bounds
                this.x = Math.max(50, Math.min(WORLD_WIDTH - 50, this.x));
                this.y = Math.max(50, Math.min(WORLD_HEIGHT - 50, this.y));
            }

            draw(ctx, camX, camY) {
                const screenX = this.x - camX;
                const screenY = this.y - camY;
                ctx.fillStyle = '#6ec8ff';
                ctx.fillRect(screenX - this.width / 2, screenY - this.height / 2, this.width, this.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(screenX - 2, screenY - 2, 1, 1);
                ctx.fillRect(screenX + 1, screenY - 2, 1, 1);
            }
        }

        // ==================== CHUNK MANAGER ====================
        class ChunkManager {
            constructor() {
                this.terrain = new TerrainGenerator();
                this.chunks = new Map();
            }

            getTile(x, y) {
                return this.terrain.generateTile(Math.floor(x / TILE_SIZE), Math.floor(y / TILE_SIZE));
            }

            drawChunk(ctx, camX, camY, startTileX, startTileY) {
                const endTileX = startTileX + Math.ceil(canvas.width / TILE_SIZE) + 2;
                const endTileY = startTileY + Math.ceil(canvas.height / TILE_SIZE) + 2;

                for (let tx = startTileX; tx < endTileX; tx++) {
                    for (let ty = startTileY; ty < endTileY; ty++) {
                        const tileType = this.getTile(tx * TILE_SIZE, ty * TILE_SIZE);
                        const color = TILE_COLORS[tileType] || '#0a1a1f';
                        
                        const worldX = tx * TILE_SIZE;
                        const worldY = ty * TILE_SIZE;
                        const screenX = worldX - camX;
                        const screenY = worldY - camY;

                        ctx.fillStyle = color;
                        ctx.fillRect(screenX, screenY, TILE_SIZE, TILE_SIZE);

                        // Add grid
                        ctx.strokeStyle = '#1a2a3a';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(screenX, screenY, TILE_SIZE, TILE_SIZE);
                    }
                }
            }
        }

        // ==================== GAME STATE ====================
        const terrain = new TerrainGenerator();
        const chunkManager = new ChunkManager();
        const player = new Player(512, 200);
        const keys = {};

        // ==================== INPUT HANDLING ====================
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // ==================== GAME LOOP ====================
        function gameLoop() {
            // Update
            player.update(keys);

            // Camera follows player
            const camX = player.x - canvas.width / 2;
            const camY = player.y - canvas.height / 2;

            // Draw
            ctx.fillStyle = '#0a1a1f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw chunks
            const startTileX = Math.floor(camX / TILE_SIZE) - 1;
            const startTileY = Math.floor(camY / TILE_SIZE) - 1;
            chunkManager.drawChunk(ctx, camX, camY, startTileX, startTileY);

            // Draw player
            player.draw(ctx, camX, camY);

            // Update debug
            const isMoving = Math.abs(player.vx) > 1 || Math.abs(player.vy) > 1 ? 'Yes' : 'No';
            debugEl.textContent = `Position: (${Math.floor(player.x)}, ${Math.floor(player.y)}) | Moving: ${isMoving} | Vel: (${Math.floor(player.vx)}, ${Math.floor(player.vy)})`;

            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
