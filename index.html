<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnderGloom - An Underground Exploration</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: 'Arial', sans-serif;
            color: #ccc;
            flex-direction: column;
            gap: 20px;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        canvas {
            border: 3px solid #1a3a3a;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.2);
            image-rendering: pixelated;
        }

        #info {
            text-align: center;
            color: #888;
            font-size: 14px;
            max-width: 800px;
        }

        #info h1 {
            color: #6ec8ff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(110, 200, 255, 0.5);
        }

        #debug {
            color: #6ec8ff;
            font-size: 12px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="info">
            <h1>UnderGloom</h1>
            <p>Use arrow keys or WASD to explore the mysterious depths...</p>
        </div>
        <div id="debug">Position: (0, 0)</div>
    </div>

    <script>
        // ==================== TILE ASSET GENERATOR ====================
        // Since we don't have the images, we'll create procedural pixel tiles
        class TileAssetGenerator {
            static createCanvas(width, height) {
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                return canvas;
            }

            static createMireClayTile() {
                const canvas = this.createCanvas(8, 8);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#4a3a2a';
                ctx.fillRect(0, 0, 8, 8);
                // Add some texture
                ctx.fillStyle = '#3a2a1a';
                ctx.fillRect(1, 1, 2, 2);
                ctx.fillRect(4, 3, 2, 2);
                ctx.fillRect(2, 5, 2, 2);
                return canvas;
            }

            static createStone() {
                const canvas = this.createCanvas(8, 8);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#2a3a4a';
                ctx.fillRect(0, 0, 8, 8);
                ctx.fillStyle = '#1a2a3a';
                ctx.fillRect(0, 0, 4, 4);
                ctx.fillRect(4, 4, 4, 4);
                return canvas;
            }

            static createCoalOre() {
                const canvas = this.createCanvas(8, 8);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#1a1a1a';
                ctx.fillRect(0, 0, 8, 8);
                ctx.fillStyle = '#2a2a2a';
                for (let i = 0; i < 4; i++) {
                    ctx.fillRect(Math.random() * 8, Math.random() * 8, 2, 2);
                }
                return canvas;
            }

            static createIronOre() {
                const canvas = this.createCanvas(8, 8);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#3a3a3a';
                ctx.fillRect(0, 0, 8, 8);
                ctx.fillStyle = '#7a7a7a';
                ctx.fillRect(2, 2, 2, 2);
                ctx.fillRect(4, 4, 2, 2);
                return canvas;
            }

            static createMushroomTile() {
                const canvas = this.createCanvas(8, 8);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0a1a1f';
                ctx.fillRect(0, 0, 8, 8);
                // Mushroom stem
                ctx.fillStyle = '#8a5a3a';
                ctx.fillRect(3, 5, 2, 3);
                // Mushroom cap
                ctx.fillStyle = '#6a4a8a';
                ctx.fillRect(1, 2, 6, 3);
                ctx.fillStyle = '#8a6aaa';
                ctx.fillRect(2, 3, 4, 2);
                return canvas;
            }

            static createBlinkMossTile() {
                const canvas = this.createCanvas(8, 8);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#4a3a2a';
                ctx.fillRect(0, 0, 8, 8);
                ctx.fillStyle = '#5a8a3a';
                ctx.fillRect(1, 4, 6, 4);
                ctx.fillStyle = '#7aaa5a';
                ctx.fillRect(2, 3, 4, 2);
                return canvas;
            }

            static createGlowPlant() {
                const canvas = this.createCanvas(8, 8);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0a1a1f';
                ctx.fillRect(0, 0, 8, 8);
                // Glowing plant
                ctx.fillStyle = '#aaff44';
                ctx.fillRect(3, 2, 2, 6);
                ctx.fillStyle = '#ffff88';
                ctx.fillRect(2, 3, 4, 2);
                return canvas;
            }

            static createEmptyTile() {
                const canvas = this.createCanvas(8, 8);
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#0a1a1f';
                ctx.fillRect(0, 0, 8, 8);
                return canvas;
            }
        }

        // ==================== GAME CONFIGURATION ====================
        const GAME_CONFIG = {
            type: Phaser.AUTO,
            width: 1024,
            height: 576,
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 0 },
                    debug: false
                }
            },
            scene: [GameScene],
            backgroundColor: '#0a1a1f',
            render: {
                pixelArt: true,
                antialias: false,
                smoothStep: false,
                autoCenter: Phaser.Scale.CENTER_BOTH
            },
            scale: {
                mode: Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH
            }
        };

        // Game Constants
        const TILE_SIZE = 8;
        const CHUNK_WIDTH = 16;
        const CHUNK_HEIGHT = 16;
        const CHUNK_PIXEL_WIDTH = CHUNK_WIDTH * TILE_SIZE;
        const CHUNK_PIXEL_HEIGHT = CHUNK_HEIGHT * TILE_SIZE;

        // Player Constants
        const PLAYER_WIDTH = 6;
        const PLAYER_HEIGHT = 6;
        const PLAYER_SPEED = 100;

        // ==================== TERRAIN GENERATOR ====================
        class TerrainGenerator {
            constructor() {
                this.seed = 12345;
            }

            seededRandom(x, y, seed = this.seed) {
                const n = Math.sin(x * 12.9898 + y * 78.233 + seed) * 43758.5453;
                return n - Math.floor(n);
            }

            generateChunk(chunkX, chunkY) {
                const terrain = [];

                for (let y = 0; y < CHUNK_HEIGHT; y++) {
                    terrain[y] = [];
                    for (let x = 0; x < CHUNK_WIDTH; x++) {
                        const worldX = chunkX * CHUNK_WIDTH + x;
                        const worldY = chunkY * CHUNK_HEIGHT + y;
                        terrain[y][x] = this.generateTile(worldX, worldY);
                    }
                }

                return terrain;
            }

            generateTile(worldX, worldY) {
                const rand = this.seededRandom(worldX, worldY);
                const oreNoise = this.seededRandom(worldX * 1.5, worldY * 1.5);

                // Surface layer (y < 2)
                if (worldY < 2) {
                    if (rand < 0.3) return 'mire-clay';
                    if (rand < 0.5) return 'blink-moss';
                    if (rand < 0.65) return 'mushroom';
                    if (rand < 0.8) return 'glow-plant';
                    return 'empty';
                }

                // Upper ground layer (y 2-6)
                if (worldY < 6) {
                    if (rand < 0.7) return 'mire-clay';
                    if (rand < 0.85 && oreNoise > 0.7) return 'ore-coal';
                    if (rand < 0.95 && oreNoise > 0.8) return 'ore-iron';
                    return 'empty';
                }

                // Deep underground (y >= 6)
                if (rand < 0.5) return 'stone';
                if (oreNoise > 0.75) {
                    if (oreNoise > 0.9) return 'ore-iron';
                    if (oreNoise > 0.85) return 'ore-coal';
                    return 'ore-coal';
                }

                return 'empty';
            }
        }

        // ==================== CHUNK MANAGER ====================
        class ChunkManager {
            constructor(scene) {
                this.scene = scene;
                this.loadedChunks = new Map();
                this.terrainGenerator = new TerrainGenerator();
                this.worldLayer = scene.add.group();
                this.tileSprites = new Map();
            }

            getChunkCoords(worldX, worldY) {
                const chunkX = Math.floor(worldX / CHUNK_PIXEL_WIDTH);
                const chunkY = Math.floor(worldY / CHUNK_PIXEL_HEIGHT);
                return { x: chunkX, y: chunkY };
            }

            getChunkKey(chunkX, chunkY) {
                return `${chunkX},${chunkY}`;
            }

            updateChunks(playerX, playerY) {
                const playerChunk = this.getChunkCoords(playerX, playerY);
                const renderDistance = 2;

                // Load chunks within render distance
                for (let x = playerChunk.x - renderDistance; x <= playerChunk.x + renderDistance; x++) {
                    for (let y = playerChunk.y - renderDistance; y <= playerChunk.y + renderDistance; y++) {
                        const key = this.getChunkKey(x, y);
                        if (!this.loadedChunks.has(key)) {
                            this.loadChunk(x, y);
                        }
                    }
                }

                // Unload chunks beyond render distance
                for (const [key, chunk] of this.loadedChunks.entries()) {
                    const [x, y] = key.split(',').map(Number);
                    if (Math.abs(x - playerChunk.x) > renderDistance + 1 || 
                        Math.abs(y - playerChunk.y) > renderDistance + 1) {
                        this.unloadChunk(x, y, key);
                    }
                }
            }

            loadChunk(chunkX, chunkY) {
                const key = this.getChunkKey(chunkX, chunkY);
                const terrain = this.terrainGenerator.generateChunk(chunkX, chunkY);
                
                const chunk = {
                    x: chunkX,
                    y: chunkY,
                    terrain: terrain,
                    sprites: []
                };

                this.renderChunk(chunk);
                this.loadedChunks.set(key, chunk);
            }

            unloadChunk(chunkX, chunkY, key) {
                const chunk = this.loadedChunks.get(key);
                if (chunk) {
                    chunk.sprites.forEach(sprite => sprite.destroy());
                }
                this.loadedChunks.delete(key);
            }

            renderChunk(chunk) {
                const startX = chunk.x * CHUNK_PIXEL_WIDTH;
                const startY = chunk.y * CHUNK_PIXEL_HEIGHT;

                for (let y = 0; y < CHUNK_HEIGHT; y++) {
                    for (let x = 0; x < CHUNK_WIDTH; x++) {
                        const tile = chunk.terrain[y][x];
                        const worldX = startX + x * TILE_SIZE;
                        const worldY = startY + y * TILE_SIZE;

                        this.createTileSprite(chunk, tile, worldX, worldY);
                    }
                }
            }

            createTileSprite(chunk, tileType, worldX, worldY) {
                let texture = null;
                const key = `tile-${tileType}`;

                if (!this.tileSprites.has(key)) {
                    texture = this.generateTileTexture(tileType);
                    this.tileSprites.set(key, texture);
                }

                const sprite = this.scene.add.sprite(worldX + TILE_SIZE / 2, worldY + TILE_SIZE / 2, key);
                sprite.setOrigin(0.5, 0.5);
                sprite.setDisplaySize(TILE_SIZE, TILE_SIZE);
                this.worldLayer.add(sprite);
                chunk.sprites.push(sprite);
            }

            generateTileTexture(tileType) {
                let canvas;
                switch (tileType) {
                    case 'stone':
                        canvas = TileAssetGenerator.createStone();
                        break;
                    case 'mire-clay':
                        canvas = TileAssetGenerator.createMireClayTile();
                        break;
                    case 'ore-coal':
                        canvas = TileAssetGenerator.createCoalOre();
                        break;
                    case 'ore-iron':
                        canvas = TileAssetGenerator.createIronOre();
                        break;
                    case 'mushroom':
                        canvas = TileAssetGenerator.createMushroomTile();
                        break;
                    case 'blink-moss':
                        canvas = TileAssetGenerator.createBlinkMossTile();
                        break;
                    case 'glow-plant':
                        canvas = TileAssetGenerator.createGlowPlant();
                        break;
                    default:
                        canvas = TileAssetGenerator.createEmptyTile();
                }

                const key = `tile-${tileType}`;
                this.scene.textures.addCanvas(key, canvas);
                return key;
            }
        }

        // ==================== PLAYER CLASS ====================
        class Player {
            constructor(scene, x, y) {
                this.scene = scene;
                this.x = x;
                this.y = y;
                this.velocityX = 0;
                this.velocityY = 0;
                this.width = PLAYER_WIDTH;
                this.height = PLAYER_HEIGHT;

                // Create player sprite
                const playerCanvas = document.createElement('canvas');
                playerCanvas.width = 6;
                playerCanvas.height = 6;
                const ctx = playerCanvas.getContext('2d');
                ctx.fillStyle = '#6ec8ff';
                ctx.fillRect(0, 0, 6, 6);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(1, 1, 1, 1);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(4, 1, 1, 1);

                this.scene.textures.addCanvas('player', playerCanvas);
                this.sprite = scene.add.sprite(x, y, 'player');
                this.sprite.setOrigin(0.5, 0.5);
            }

            move(left, right, up, down) {
                // Horizontal movement
                if (left) {
                    this.velocityX = -PLAYER_SPEED;
                } else if (right) {
                    this.velocityX = PLAYER_SPEED;
                } else {
                    this.velocityX *= 0.8;
                }

                // Vertical movement
                if (up) {
                    this.velocityY = -PLAYER_SPEED * 0.7;
                } else if (down) {
                    this.velocityY = PLAYER_SPEED * 0.7;
                } else {
                    this.velocityY *= 0.8;
                }

                // Apply velocity
                const delta = 1 / 60; // 60 FPS
                this.x += this.velocityX * delta;
                this.y += this.velocityY * delta;

                // Boundary constraints
                if (this.x < 50) this.x = 50;
                if (this.x > 10000 - 50) this.x = 10000 - 50;
                if (this.y < 50) this.y = 50;
                if (this.y > 1000 - 50) this.y = 1000 - 50;

                this.sprite.x = this.x;
                this.sprite.y = this.y;
            }

            getPosition() {
                return { x: this.x, y: this.y };
            }
        }

        // ==================== GAME SCENE ====================
        class GameScene extends Phaser.Scene {
            constructor() {
                super({ key: 'GameScene' });
            }

            create() {
                // Set up camera
                this.cameras.main.setBounds(0, 0, 10000, 1000);
                this.cameras.main.setLerp(0.15, 0.15);

                // Initialize systems
                this.chunkManager = new ChunkManager(this);
                this.player = new Player(this, 512, 200);

                // Load initial chunks
                this.chunkManager.updateChunks(this.player.x, this.player.y);

                // Input handling
                this.cursors = this.input.keyboard.createCursorKeys();
                this.wasd = this.input.keyboard.addKeys({
                    up: Phaser.Input.Keyboard.KeyCodes.W,
                    down: Phaser.Input.Keyboard.KeyCodes.S,
                    left: Phaser.Input.Keyboard.KeyCodes.A,
                    right: Phaser.Input.Keyboard.KeyCodes.D
                });
            }

            update() {
                // Get input
                const moveLeft = this.cursors.left.isDown || this.wasd.left.isDown;
                const moveRight = this.cursors.right.isDown || this.wasd.right.isDown;
                const moveUp = this.cursors.up.isDown || this.wasd.up.isDown;
                const moveDown = this.cursors.down.isDown || this.wasd.down.isDown;

                // Move player
                this.player.move(moveLeft, moveRight, moveUp, moveDown);

                // Update camera
                this.cameras.main.centerOn(this.player.x, this.player.y);

                // Update chunks
                this.chunkManager.updateChunks(this.player.x, this.player.y);

                // Update debug info
                const pos = this.player.getPosition();
                document.getElementById('debug').textContent = `Position: (${Math.floor(pos.x)}, ${Math.floor(pos.y)})`;
            }
        }

        // ==================== GAME INITIALIZATION ====================
        const game = new Phaser.Game(GAME_CONFIG);
    </script>
</body>
</html>
